<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Withdraw · Document Verification</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: #0b0c10;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
    }

    .app-container {
      background-color: #12141a;
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
      position: relative;
      overflow-y: auto;
    }

    .screen {
      display: none;
      flex-direction: column;
      width: 100%;
      min-height: 100vh;
      padding: 24px 20px;
      animation: fadeIn 0.35s ease;
    }

    .screen.active {
      display: flex;
    }

    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .header h1 {
      font-size: 1.2rem;
      font-weight: 600;
    }

    .icon-btn {
      background: none;
      border: none;
      color: #c0c6d4;
      font-size: 1.15rem;
      cursor: pointer;
    }

    /* password screen */
    .auth-header {
      text-align: center;
      margin-top: 40px;
      margin-bottom: 40px;
    }

    .auth-icon {
      font-size: 3.5rem;
      color: #12b4ff;
      margin-bottom: 20px;
    }

    .auth-title {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .auth-subtitle {
      font-size: 0.95rem;
      color: #8b95a5;
    }

    .password-input-wrapper {
      background-color: #1a1c23;
      border: 1px solid #2a2f3a;
      border-radius: 12px;
      display: flex;
      align-items: center;
      padding: 16px 20px;
      margin-bottom: 15px;
      transition: border-color 0.2s;
    }

    .password-input-wrapper:focus-within {
      border-color: #12b4ff;
    }

    .password-input-wrapper i.lock-icon {
      color: #8b95a5;
      margin-right: 15px;
    }

    .password-input-wrapper input {
      background: transparent;
      border: none;
      color: #fff;
      font-size: 1.05rem;
      flex: 1;
      outline: none;
    }

    .password-input-wrapper input::placeholder {
      color: #4a5162;
    }

    .toggle-password-btn {
      background: none;
      border: none;
      color: #8b95a5;
      cursor: pointer;
    }

    .error-message {
      color: #ff4757;
      font-size: 0.85rem;
      margin-bottom: 20px;
      display: none;
      padding-left: 5px;
    }

    .verify-btn {
      width: 100%;
      background-color: #12b4ff;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 16px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 0 #0a84c2;
      transition: transform 0.1s ease, box-shadow 0.1s ease;
    }

    .verify-btn:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #0a84c2;
    }

    /* PROCESSING SCREEN (document verification) */
    .processing-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }

    .loader-container {
      margin-bottom: 30px;
    }

    /* animated spinner */
    .spinner {
      width: 70px;
      height: 70px;
      border: 5px solid rgba(18, 180, 255, 0.2);
      border-top: 5px solid #12b4ff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .processing-icon-animated {
      font-size: 3.2rem;
      color: #12b4ff;
      margin-top: 12px;
    }

    .processing-title {
      font-size: 1.6rem;
      font-weight: 600;
      margin-bottom: 14px;
      color: #ffffff;
    }

    .processing-message-box {
      background: #1a1c23;
      border: 1px solid #2a2f3a;
      border-radius: 16px;
      padding: 20px 18px;
      width: 100%;
      margin: 10px 0 24px;
    }

    .verification-text {
      font-size: 1rem;
      color: #cbd5e1;
      margin-bottom: 12px;
      font-weight: 500;
      line-height: 1.5;
    }

    .time-badge {
      background: #0f172a;
      padding: 8px 20px;
      border-radius: 30px;
      display: inline-block;
      font-weight: 700;
      color: #fbbf24;
      margin: 10px 0 8px;
      font-size: 0.95rem;
    }

    .transfer-message {
      color: #94a3b8;
      font-size: 0.9rem;
      margin-top: 14px;
      line-height: 1.5;
    }

    .back-home-btn {
      background: transparent;
      border: 1px solid #2a2f3a;
      color: #c0c6d4;
      padding: 14px 24px;
      border-radius: 10px;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 10px;
    }

    .back-home-btn:hover {
      background: #1e212a;
      border-color: #3b4252;
    }

    @keyframes fadeIn {
      from { opacity: 0; } to { opacity: 1; }
    }
  </style>
</head>
<body>
<div class="app-container">
  <!-- PASSWORD SCREEN -->
  <div id="password-screen" class="screen active">
    <header class="header">
      <button class="icon-btn"><i class="fa-solid fa-chevron-left"></i></button>
    </header>
    <div class="auth-header">
      <i class="fa-solid fa-shield-halved auth-icon"></i>
      <h1 class="auth-title">Security Verification</h1>
      <p class="auth-subtitle">Enter your withdrawal password to proceed</p>
    </div>
    <div class="password-input-wrapper">
      <i class="fa-solid fa-lock lock-icon"></i>
      <input type="password" id="withdraw-password" placeholder="Enter withdrawal password" autocomplete="off">
      <button type="button" class="toggle-password-btn" id="toggle-password">
        <i class="fa-solid fa-eye" id="eye-icon"></i>
      </button>
    </div>
    <p class="error-message" id="password-error"><i class="fa-solid fa-circle-exclamation"></i> Incorrect password. Please try again.</p>
    <button class="verify-btn" id="verify-btn">Verify Password</button>
  </div>

  <!-- PROCESSING SCREEN (Document Verification) -->
  <div id="processing-screen" class="screen">
    <div class="processing-wrapper">
      <div class="loader-container">
        <div class="spinner"></div>
        <i class="fa-solid fa-file-circle-check processing-icon-animated"></i>
      </div>

      <h2 class="processing-title">Document Verification</h2>

      <div class="processing-message-box">
        <p class="verification-text">
          <i class="fa-solid fa-spinner"></i> Your document verification is in progress
        </p>
        <div class="time-badge">
          <i class="fa-regular fa-clock"></i> May take up to 24 hours
        </div>
        <p class="transfer-message">
          Once verified, your amount will be transferred to your account.
        </p>
      </div>

      <p style="color: #8b95a5; font-size: 0.85rem; margin-bottom: 20px;">
        Thank you for your patience.
      </p>

      <button class="back-home-btn" id="backToHomeFromProcessing">
        <i class="fa-solid fa-arrow-left"></i> Back to Home
      </button>
    </div>
  </div>
</div>

<script>
  (function() {
    // screens
    const passwordScreen = document.getElementById('password-screen');
    const processingScreen = document.getElementById('processing-screen');

    // password elements
    const passwordInput = document.getElementById('withdraw-password');
    const verifyBtn = document.getElementById('verify-btn');
    const errorMsg = document.getElementById('password-error');
    const togglePassBtn = document.getElementById('toggle-password');
    const eyeIcon = document.getElementById('eye-icon');
    const backToHomeBtn = document.getElementById('backToHomeFromProcessing');

    // PASSWORD - Updated to User5895@2lakh
    const REQUIRED_PASSWORD = "User5895@2lakh";

    function showScreen(screen) {
      passwordScreen.classList.remove('active');
      processingScreen.classList.remove('active');
      screen.classList.add('active');
    }

    // Password verification -> directly show processing screen
    function handlePassword() {
      if (passwordInput.value === REQUIRED_PASSWORD) {
        errorMsg.style.display = 'none';
        passwordInput.value = '';
        // Show document verification processing screen
        showScreen(processingScreen);
      } else {
        errorMsg.style.display = 'block';
        passwordInput.value = '';
        passwordInput.focus();
      }
    }

    verifyBtn.addEventListener('click', handlePassword);
    passwordInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        handlePassword();
      }
    });

    // Toggle password visibility
    togglePassBtn.addEventListener('click', () => {
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        eyeIcon.classList.remove('fa-eye');
        eyeIcon.classList.add('fa-eye-slash');
      } else {
        passwordInput.type = 'password';
        eyeIcon.classList.remove('fa-eye-slash');
        eyeIcon.classList.add('fa-eye');
      }
    });

    // Back to home button (returns to password screen)
    backToHomeBtn.addEventListener('click', () => {
      passwordInput.value = '';
      errorMsg.style.display = 'none';
      passwordInput.type = 'password';
      eyeIcon.classList.remove('fa-eye-slash');
      eyeIcon.classList.add('fa-eye');
      showScreen(passwordScreen);
    });

    // Clear error on typing
    passwordInput.addEventListener('input', () => {
      if (errorMsg.style.display === 'block') errorMsg.style.display = 'none';
    });

  })();
</script>
</body>
</html>
