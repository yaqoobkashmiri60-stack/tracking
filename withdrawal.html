<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Withdrawal Successful · Fantasy Sports</title>
  <style>
    /* ----- CSS reset & modern font ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background: linear-gradient(145deg, #f4f7fc 0%, #e9eef4 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      margin: 0;
    }

    /* main card – mobile friendly container */
    .withdrawal-container {
      max-width: 440px;
      width: 100%;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-radius: 48px 48px 32px 32px;
      box-shadow: 0 25px 50px -12px rgba(0,20,40,0.35), 0 4px 18px 0 rgba(0,0,0,0.06);
      padding: 28px 22px 38px 22px;
      transition: all 0.2s ease;
      border: 1px solid rgba(255,255,255,0.6);
    }

    /* logo area with actual image from github */
    .logo-area {
      display: flex;
      justify-content: center;
      margin-bottom: 22px;
    }
    .logo-img {
      max-width: 180px;
      height: auto;
      background: white;
      border-radius: 60px;
      padding: 10px 24px;
      box-shadow: 0 12px 22px -10px rgba(0,40,80,0.25);
      border: 1px solid rgba(255,255,255,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo-img img {
      width: 100%;
      height: auto;
      max-height: 60px;
      object-fit: contain;
    }

    /* Success Screen Styles */
    .success-screen {
      display: block;
      text-align: center;
      padding: 20px 10px;
    }
    .success-icon {
      width: 100px;
      height: 100px;
      background: linear-gradient(145deg, #0f614e, #1c8b4c);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 4rem;
      color: white;
      box-shadow: 0 20px 30px -10px #09432b;
      animation: popIn 0.5s ease;
    }
    .success-title {
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, #0f2b3f, #1b4a6f);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      margin-bottom: 16px;
    }
    .success-message {
      font-size: 1.4rem;
      color: #1f384f;
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .time-badge {
      background: #e2f0e8;
      padding: 18px 22px;
      border-radius: 60px;
      display: inline-block;
      margin: 16px 0 30px;
      border-left: 6px solid #2b8c5e;
    }
    .time-badge span {
      font-size: 1.6rem;
      font-weight: 700;
      color: #0b5730;
      display: block;
      margin-bottom: 6px;
    }
    .time-badge small {
      font-size: 1.1rem;
      color: #3a7853;
    }
    .amount-info {
      font-size: 1.5rem;
      color: #1f384f;
      margin: 20px 0;
      font-weight: 600;
    }
    .amount-info span {
      color: #b45f2b;
      background: #fff1e0;
      padding: 8px 22px;
      border-radius: 40px;
      display: inline-block;
      margin-top: 10px;
      font-size: 2rem;
    }
    .home-btn {
      background: linear-gradient(105deg, #1e2b4a, #294d73);
      border: none;
      padding: 18px 32px;
      border-radius: 60px;
      color: white;
      font-size: 1.4rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 20px 30px -12px #0b3050;
      transition: 0.2s;
      border: 1px solid rgba(255,255,255,0.3);
      width: 100%;
      max-width: 280px;
      margin: 20px auto 0;
    }
    .home-btn:hover {
      transform: scale(1.02);
      background: linear-gradient(105deg, #253a5a, #2f608b);
    }

    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      80% { transform: scale(1.1); }
      100% { transform: scale(1); opacity: 1; }
    }

    .footer-note {
      text-align: center;
      color: #637e9b;
      margin-top: 22px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

<div class="withdrawal-container">
  <!-- Logo -->
  <div class="logo-area">
    <div class="logo-img">
      <img src="https://github.com/user-attachments/assets/9d722eec-f5d9-4f49-8053-833bbcb93a00" 
           alt="Fantasy Sports Logo"
           onerror="this.onerror=null; this.src='data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22160%22%20height%3D%2260%22%20viewBox%3D%220%200%20160%2060%22%3E%3Crect%20width%3D%22160%22%20height%3D%2260%22%20fill%3D%22%231d267d%22%20rx%3D%2230%22%2F%3E%3Ctext%20x%3D%2230%22%20y%3D%2240%22%20font-family%3D%22Arial%22%20font-size%3D%2224%22%20fill%3D%22%23ffffff%22%3EFANTASY%3C%2Ftext%3E%3C%2Fsvg%3E';">
    </div>
  </div>

  <!-- Success Screen (only withdrawal successful message) -->
  <div class="success-screen">
    <div class="success-icon">✅</div>
    <div class="success-title">Withdrawal Successful!</div>
    <div class="success-message">
      Your request has been processed successfully
    </div>
    
    <!-- 24-48 hours message (as requested) -->
    <div class="time-badge">
      <span>⏳ 24-48 hours</span>
      <small>amount will reflect in your bank account</small>
    </div>

    <!-- Amount display -->
    <div class="amount-info">
      <div>Your winning amount</div>
      <span>₹22,00,000</span>
    </div>

    <!-- Home button (optional) -->
    <button class="home-btn" onclick="alert('Thanks for using Fantasy Sports!')">🏠 Back to Home</button>
  </div>

  <div class="footer-note">✨ Thank you for playing with us</div>
</div>

</body>
</html>
